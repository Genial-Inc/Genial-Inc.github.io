    [[languages.en.params.team.members]]
      name = "Ablaye Le Déroff"
      shortName = "Ablaye"
      description = "The beatboxer of the group."

    [[languages.en.params.team.members]]
      name = "Raphaël"
      shortName = "Raphaël"
      description = "The literature enthusiast."

  [[languages.en.menus.main]]
    identifier = "home"
    name = "Home"
    pageRef = "/"
    weight = 1
  [[languages.en.menus.main]]
    name = "About"
    pageRef = "/about-us"
    weight = 2
  [[languages.en.menus.main]]
    name = "Projects"
    url = "#projects"
    weight = 3
