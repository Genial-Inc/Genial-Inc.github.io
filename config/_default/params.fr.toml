description = "Collectif d'étudiants passionnés par les mathématiques et l'informatique, pour la plupart en double licence Mathématiques-Informatique (DLMI) à l'INU Champollion."

[hero]
  # Projet mis en avant : son image de couverture sert de fond et son titre de sur-titre.
  project = "/projects/genial-bubble"
  description = "Jeu de plateformes – Global Game Jam 2025"
  quote = "On n'apprend pas à faire du vélo en regardant quelqu'un faire du vélo."
  quoteAuthor = "M. Thierry Montaut"
  [hero.button]
    text = "Jouer"
    url = "/play/genial-bubble/"

[about]
  page = "/about-us"   # page « En savoir plus »
  title = "Qu'est-ce que Génial Inc. ?"
  description = """
  Nous sommes un petit groupe d'étudiants passionnés par les mathématiques
  et l'informatique, actifs dans de nombreux projets et événements !
  La plupart d'entre nous étudient en double licence Mathématiques-Informatique (DLMI)
  à l'INU Champollion.
  """

