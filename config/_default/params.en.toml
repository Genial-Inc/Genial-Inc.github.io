description = "A collective of students passionate about mathematics and computer science, most of us from the Mathematics–Computer Science double degree (DLMI) at INU Champollion."

[hero]
  # Featured project: its cover image is the background and its title the kicker.
  project = "/projects/genial-bubble"
  description = "Platformer – Global Game Jam 2025"
  quote = "You don't learn to ride a bike by watching someone else ride a bike."
  quoteAuthor = "Thierry Montaut"
  [hero.button]
    text = "Play"
    url = "/play/genial-bubble/"

[about]
  page = "/about-us"   # "Learn more" page
  title = "What is Genial Inc.?"
  description = """
  We are a small group of students passionate about mathematics and computer
  science, involved in lots of projects and events!
  Most of us study for the Mathematics–Computer Science double degree (DLMI)
  at INU Champollion.
  """

